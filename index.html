<!doctype html>
<html lang="en">
<head>

  <title>Runes of the Hollow — Reforged Linked Kits</title>
  <style>
    :root{--ink:#eee9dc;--muted:#aaa3b6;--gold:#efc66b;--violet:#9c7bff;--blue:#67d8ff;--red:#ff6e82;--green:#78e0a2;--panel:rgba(12,10,24,.93);--line:rgba(239,198,107,.24)}

<style id="introTrailerStyles">
  #introTrailer {
    position: fixed;
    inset: 0;
    z-index: 99999;
    background: #03030a;
    display: grid;
    place-items: center;
    overflow: hidden;
    opacity: 1;
    transition: opacity .65s ease;
  }
  #introTrailer.hiding { opacity: 0; pointer-events: none; }
  #introTrailer.hiddenIntro { display: none; }
  #introTrailerVideo {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #03030a;
  }
  .introTrailerControls {
    position: absolute;
    left: max(14px, env(safe-area-inset-left));
    right: max(14px, env(safe-area-inset-right));
    bottom: max(14px, env(safe-area-inset-bottom));
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    pointer-events: none;
    font-family: Arial, sans-serif;
  }
  .introTrailerControls button {
    pointer-events: auto;
    min-height: 42px;
    border: 1px solid rgba(239,198,107,.55);
    background: rgba(7,6,16,.78);
    color: #eee9dc;
    padding: 10px 14px;
    border-radius: 6px;
    font: 700 12px/1 Arial, sans-serif;
    letter-spacing: .05em;
    cursor: pointer;
    backdrop-filter: blur(8px);
  }
  .introTrailerControls button:hover,
  .introTrailerControls button:focus-visible {
    border-color: #efc66b;
    outline: 2px solid rgba(239,198,107,.25);
    outline-offset: 2px;
  }
  #introSoundBtn {
    color: #efc66b;
  }
  #introTrailerHint {
    position: absolute;
    left: 50%;
    bottom: max(68px, calc(env(safe-area-inset-bottom) + 68px));
    transform: translateX(-50%);
    color: rgba(238,233,220,.78);
    background: rgba(7,6,16,.62);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 999px;
    padding: 7px 11px;
    font: 11px/1.2 Arial, sans-serif;
    pointer-events: none;
    opacity: 0;
    transition: opacity .25s ease;
    white-space: nowrap;
  }
  #introTrailerHint.show { opacity: 1; }
  @media (max-width: 520px) {
    .introTrailerControls button { padding: 9px 11px; font-size: 11px; }
    #introTrailerHint { font-size: 10px; }
  }
</style>
